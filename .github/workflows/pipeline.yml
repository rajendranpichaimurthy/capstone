# ML pipeline for the engine predictive maintenance project
# runs on every push to main that changes the data, code or this file (or manually from the Actions tab)
# jobs: 1) data registration -> 2) data preparation -> 3) model training
# the train/test split is passed from job 2 to job 3 as the artifact "train-test-data"
# job 3 commits the best model back to the main branch

name: ml-pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "requirements-pipeline.txt"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed so the last step can push the model to main

jobs:
  data-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install libraries
        run: pip install -r requirements-pipeline.txt
      - name: Register and validate the dataset
        run: python src/register_data.py
      - name: Save the registry file
        uses: actions/upload-artifact@v4
        with:
          name: data-registry
          path: data/registry.json

  data-preparation:
    needs: data-registration
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install libraries
        run: pip install -r requirements-pipeline.txt
      - name: Clean the data and split into train/test
        run: python src/prep.py
      - name: Upload train/test split as an artifact for the next job
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: data/processed/
          retention-days: 7

  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install libraries
        run: pip install -r requirements-pipeline.txt
      - name: Download the train/test artifact from the previous job
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: artifacts/train-test-data
      - name: Train, tune and track the models with MLflow
        env:
          ARTIFACT_DIR: artifacts/train-test-data
        run: python src/train.py
      - name: Save the MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: |
            mlflow.db
            mlruns/
      - name: Commit the best model to the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "model files did not change, nothing to commit"
          else
            git commit -m "Update best model from pipeline run [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
